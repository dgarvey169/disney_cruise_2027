<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Disney Cruise 2027 - 8-Bit Game</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
    <!-- Google Retro Pixel Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Load Phaser 3 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <script>
        // Bump ASSET_VERSION whenever ANY file under js/ changes (cache-buster for all scripts).
        const ASSET_VERSION = '8.1';
        // Load order matters: helpers before the scenes that use them; main.js MUST be last.
        // async = false guarantees dynamically inserted scripts execute in insertion order.
        [
            'js/lib/config.js',
            'js/lib/amelia-outfit.js',
            'js/lib/oceaneer-club-data.js',
            'js/scenes/BootScene.js',
            'js/lib/edge-arcade-textures.js',
            'js/scenes/TitleScene.js',
            'js/scenes/CharacterSelectScene.js',
            'js/scenes/GameScene.js',
            'js/scenes/ElevatorMenuScene.js',
            'js/lib/boutique-icons.js',
            'js/scenes/BoutiqueScene.js',
            'js/lib/arcade-audio.js',
            'js/scenes/EdgeClubScene.js',
            'js/scenes/ArcadeShooterScene.js',
            'js/scenes/HeroZoneScene.js',
            'js/scenes/ObstacleCourseScene.js',
            'js/scenes/AirHockeyScene.js',
            'js/scenes/BasketballShootoutScene.js',
            'js/scenes/OceaneerClubScene.js',
            'js/scenes/RalphSlideWingScene.js',
            'js/scenes/ImagineeringLabWingScene.js',
            'js/scenes/MarvelAcademyWingScene.js',
            'js/scenes/StarWarsCargoWingScene.js',
            'js/scenes/FairytaleHallWingScene.js',
            'js/main.js'
        ].forEach(src => {
            const s = document.createElement('script');
            s.src = `${src}?v=${ASSET_VERSION}`;
            s.async = false;
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
